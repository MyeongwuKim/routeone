query NotificationInbox($first: Int!, $after: String) {
  notificationInbox(first: $first, after: $after) {
    items {
      id
      notificationKey
      type
      festivalKind
      regionCode
      regionLabel
      dateKey
      festivalIds
      festivalTitles
      festivalStartDates
      festivalEndDates
      routeReviewKind
      routeId
      routeTitle
      dayId
      routeDayIndex
      routeStartAt
      stopId
      placeTitle
      correctionDeadlineAt
      availableAt
      readAt
      createdAt
      updatedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  unreadNotificationCount
}
