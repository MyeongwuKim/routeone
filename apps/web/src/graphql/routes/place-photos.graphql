query PlacePhotos($place: PlaceSnapshotInput!, $limit: Int) {
  placePhotos(place: $place, limit: $limit) {
    id
    userId
    isMine
    reportedByMe
    placeKey
    placeKeys
    provider
    externalId
    contentId
    contentTypeId
    title
    address
    lat
    lng
    categoryLabel
    categoryName
    placeImageUrl
    regionCode
    regionLabelKey
    imageId
    imageUrl
    thumbnailUrl
    variant
    source
    status
    verifiedAt
    createdAt
    updatedAt
  }
}

mutation ReportPlacePhoto(
  $photoId: ID!
  $reason: PlacePhotoReportReason!
  $details: String
) {
  reportPlacePhoto(photoId: $photoId, reason: $reason, details: $details) {
    id
    photoId
    reason
    details
    status
    createdAt
    updatedAt
  }
}

mutation CancelPlacePhotoReport($photoId: ID!) {
  cancelPlacePhotoReport(photoId: $photoId) {
    id
    photoId
    status
    updatedAt
  }
}
